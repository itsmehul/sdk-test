name: Release

on:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@itsmehul"
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run build test lint:pkg lint:types --filter "./packages/*"
      - name: Open release PR or publish to npm
        uses: changesets/action@v1
        with:
          version: pnpm exec changeset version
          publish: pnpm exec changeset publish
          commit: "chore: release packages"
          title: "chore: release packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # changesets v3 no longer prints "New tag:" lines, so changesets/action
      # never pushes the tags `changeset publish` creates or opens releases.
      - name: Push tags and create GitHub releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in $(git tag --points-at HEAD); do
            git push origin "refs/tags/$tag"
            gh release view "$tag" >/dev/null 2>&1 && continue
            version="${tag##*@}"
            changelog="packages/$(basename "${tag%@*}")/CHANGELOG.md"
            notes=$(awk -v h="## $version" '$0 == h { f = 1; next } /^## / { f = 0 } f' "$changelog" 2>/dev/null)
            flags=()
            [[ "$version" == *-* ]] && flags+=(--prerelease)
            gh release create "$tag" --title "$tag" --notes "${notes:-Release $tag}" "${flags[@]}"
          done
