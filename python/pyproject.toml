[project]
name = "interfaze-python-workspace"
version = "0.0.0"
requires-python = ">=3.10"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["interfaze", "langchain-interfaze"]

[tool.uv.sources]
interfaze = { workspace = true }
langchain-interfaze = { workspace = true }

[dependency-groups]
dev = [
  "datamodel-code-generator>=0.83.0",
  "pyright>=1.1.414",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "ruff>=0.16.10",
  "interfaze",
  "langchain-interfaze",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["**/_generated/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["interfaze/src", "langchain-interfaze/src", "interfaze/tests", "langchain-interfaze/tests"]
exclude = ["**/_generated"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportPrivateUsage = false
reportMissingTypeStubs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["interfaze/tests", "langchain-interfaze/tests"]
