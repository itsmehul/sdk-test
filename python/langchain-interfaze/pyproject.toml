[project]
name = "langchain-interfaze"
version = "0.1.0"
description = "Interfaze chat models and embeddings for LangChain"
readme = { text = "Interfaze chat models and embeddings for LangChain.", content-type = "text/plain" }
license = "MIT"
requires-python = ">=3.10"
keywords = ["interfaze", "langchain", "llm", "embeddings"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Typing :: Typed",
]
dependencies = ["langchain-core>=1.0,<2", "langchain-openai>=1.0,<2"]

[project.urls]
Repository = "https://github.com/interfaze/sdk"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/langchain_interfaze"]
